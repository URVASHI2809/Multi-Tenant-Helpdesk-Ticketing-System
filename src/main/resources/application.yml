spring:
  application:
    name: multi-tenant-helpdesk
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/helpdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false
server:
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
